<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LeonVex Co.</title>
<meta name="description" content="Abarrotes, dulces y aguas de mesa. Arma tu pedido y envíalo por WhatsApp.">
<meta name="theme-color" content="#171512">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f0a91a'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='900' font-size='30' text-anchor='middle' fill='%232b1c00'%3ELV%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#1c1a16;--ink2:#5f594c;--bg:#faf6ec;--line:#e8e0cc;--gold:#f0a91a;--gold-ink:#2b1c00;--wa:#1b8a4a;--red:#b8341b;--dark:#171512}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.pad{padding-top:18px}
.load{padding:80px 16px;text-align:center;color:var(--ink2)}

/* Hero */
.hero{background:radial-gradient(900px 420px at 88% -10%,rgba(240,169,26,.30),transparent 60%),var(--dark);color:#fff;padding:28px 0 30px}
.mono{display:inline-grid;place-items:center;width:54px;height:54px;border-radius:15px;background:var(--gold);color:var(--gold-ink);font-weight:900;font-size:23px;letter-spacing:.5px}
.hero h1{font-size:36px;line-height:1.05;margin:16px 0 6px;letter-spacing:-.6px}
.lema{color:#d9d2c0;margin:0 0 16px;font-size:17px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.tags span{border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:5px 12px;font-size:13px;color:#efe8d6}
.cta{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;border:0;font-weight:800;font-size:16px;text-decoration:none;cursor:pointer;text-align:center}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1.5px solid var(--red);color:var(--red)}
.btn.big{min-height:54px;font-size:17px}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:11px}
.hero .btn.ghost{border-color:rgba(255,255,255,.35);color:#fff}

/* Filtros */
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.search{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;background:#fff}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Productos */
.sec h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:22px 0 2px}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:16px;line-height:1.25}
.nm small{display:block;color:var(--ink2);font-size:13px}
.pr{display:block;font-weight:800;font-size:17px;margin-top:2px}
.add{flex:none;border:2px solid var(--ink);background:transparent;border-radius:12px;min-height:44px;padding:0 16px;font-weight:800;font-size:15px;cursor:pointer}
.st{flex:none;display:flex;align-items:center;background:var(--ink);color:#fff;border-radius:12px}
.st button{width:44px;height:44px;background:none;border:0;color:#fff;font-size:22px;font-weight:700;cursor:pointer}
.st b{min-width:28px;text-align:center}
.out{flex:none;color:var(--red);font-weight:800;font-size:13px;border:1.5px solid var(--red);border-radius:99px;padding:5px 12px}
.it.off .nm{opacity:.55}
.empty{padding:40px 8px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}

/* Barra de pedido (arriba del cartel de Netlify) */
.bar{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:20;max-width:696px;margin:0 auto}
.bar:empty{display:none}
.bar button{width:100%;min-height:58px;border:0;border-radius:16px;background:var(--gold);color:var(--gold-ink);font-weight:900;font-size:17px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;box-shadow:0 10px 28px rgba(0,0,0,.30);cursor:pointer}

/* Pie */
.foot{margin-top:34px;padding:8px 0 10px;border-top:1px solid var(--line)}
.foot h2{font-size:22px;margin:18px 0 8px}
.dl{display:grid;gap:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:14px}
.dl div{padding:11px 0;border-bottom:1px solid var(--line)}
.dl div:last-child{border:0}
.dl dt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:800}
.dl dd{margin:2px 0 0}
.made{text-align:center;color:var(--ink2);font-size:13px;margin:20px 0 0}
.made a{font-weight:700}

/* Hojas (diálogo) */
dialog{border:0;padding:0;width:100%;max-width:560px;margin:auto auto 0;border-radius:22px 22px 0 0;background:#fff;color:var(--ink);max-height:92dvh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.sh{padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:0}
.sh h3{margin:0 0 10px;font-size:21px}
.sh .btn{margin-top:10px;width:100%}
.lb{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.fld{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:#fff}
textarea.fld{min-height:0;resize:vertical}
.hint{color:var(--ink2);font-size:14px;margin:4px 0 8px}
.hint code{background:#f3ecd9;border-radius:6px;padding:1px 6px;font-size:13px}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-weight:600}
.chk input{width:22px;height:22px}
.ci{max-height:34dvh;overflow:auto;margin:0 -4px;padding:0 4px}
.ci .it{padding:9px 0}
.ci .sub{font-weight:800;min-width:70px;text-align:right}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:900;padding:14px 0 4px}
.warn{background:#fff1d6;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin:6px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Admin */
.auth{max-width:440px;text-align:center}
.auth .mono{margin:10px 0 6px}
.auth h1{margin:6px 0}
.auth form{text-align:left}
.msg{min-height:22px;margin:10px 0 0;font-size:14px;font-weight:600;color:var(--red)}
.msg.ok{color:var(--wa)}
.lnk{display:block;width:100%;background:none;border:0;padding:12px;font-weight:700;text-decoration:underline;cursor:pointer;color:var(--ink2)}
.ahead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.ahead small{color:var(--ink2);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.ahead h1{margin:2px 0 0;font-size:24px;line-height:1.1}
.ab{display:flex;gap:8px;flex:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.tabs button{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tools .btn:first-child{grid-column:1/-1}
.acard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 14px 14px;margin:12px 0}
.acard .it{cursor:pointer}
.tg{flex:none;min-height:38px;border-radius:99px;border:1.5px solid var(--line);background:#fff;padding:0 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--wa)}
.tg.off{background:var(--red);border-color:var(--red);color:#fff}
.count{color:var(--ink2);font-size:14px;margin:8px 0 0}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.box h3{margin:0 0 4px;font-size:17px}
.url{word-break:break-all;background:#f3ecd9;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-90px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:100;transition:transform .25s;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#toast.bad{background:var(--red)}

@media (min-width:700px){
  body{font-size:17px}
  .hero{padding:44px 0 44px}
  .hero h1{font-size:46px}
  .cta{grid-template-columns:1fr 1fr;max-width:520px}
  dialog{margin:auto;border-radius:22px;max-height:88dvh}
}
</style>
</head>
<body>
<div id="app"><div class="load">Cargando…</div></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHmJkr5aMLjq4ztiBIhPR3hbj7Zmm7n-o",
  authDomain: "cobranzas-esstrada.firebaseapp.com",
  projectId: "cobranzas-esstrada",
  storageBucket: "cobranzas-esstrada.firebasestorage.app",
  messagingSenderId: "658958936479",
  appId: "1:658958936479:web:c09fe174361ab38a0a35aa"
};

/* ====== CONFIGURACIÓN DE ESTA TIENDA ====== */
const TIENDA = "leonvex";                 // nombre interno (único por cliente)
const WA_DEFAULT = "51963845681";         // WhatsApp que recibe pedidos (el dueño lo cambia en el panel)
const WA_ESSTRADA = "51963845681";        // contacto de ESSTRADA Co.
const DEF = {
  nombre: "LeonVex Co.",
  lema: "Abarrotes, dulces y aguas de mesa",
  whatsapp: WA_DEFAULT,
  horario: "",
  direccion: "",
  pedidoMin: 0,
  delivery: ""
};
const CATS = ["Abarrotes", "Dulces y golosinas", "Aguas y bebidas", "Limpieza", "Otros"];
const EJEMPLO = `Arroz extra | saco 50 kg | 190 | Abarrotes
Azúcar rubia | saco 50 kg | 205 | Abarrotes
Aceite vegetal | caja x12 botellas de 1 L | 118 | Abarrotes
Fideo spaghetti | paquete x20 de 250 g | 36 | Abarrotes
Sal de mesa | paquete x24 de 1 kg | 22 | Abarrotes
Leche evaporada | caja x48 tarros | 165 | Abarrotes
Atún en aceite | caja x48 latas | 190 | Abarrotes
Avena en hojuelas | paquete x20 | 34 | Abarrotes
Caramelos surtidos | bolsa de 1 kg | 14 | Dulces y golosinas
Chupetines | caja x100 | 18 | Dulces y golosinas
Chocolate en barra | caja x24 | 32 | Dulces y golosinas
Chicles | caja x100 | 25 | Dulces y golosinas
Gomitas | bolsa de 1 kg | 16 | Dulces y golosinas
Galleta de soda | paquete x6 | 7.50 | Dulces y golosinas
Agua de mesa sin gas 625 ml | paquete x15 | 17 | Aguas y bebidas
Agua de mesa sin gas 3 L | paquete x4 | 11 | Aguas y bebidas
Agua con gas 625 ml | paquete x12 | 20 | Aguas y bebidas
Bidón de agua 20 L | bidón | 12 | Aguas y bebidas`;
/* ========================================= */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ref = doc(db, "tiendas", TIENDA);

const S = {
  cfg: null, exists: null, loaded: false, error: "", prods: [],
  cart: {}, cat: "Todos", q: "", form: { nombre: "", tipo: "recojo", dir: "", nota: "" },
  user: null, authReady: false, tab: "prod", aq: "", mode: "login", email: "", sheet: "", last: { c: "" }
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const money = n => { const c = Math.round(n * 100); return "S/ " + (c % 100 === 0 ? String(c / 100) : (c / 100).toFixed(2)); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const catsOf = l => { const s = []; l.forEach(p => { if (!s.includes(p.c)) s.push(p.c); }); return s; };
const isAdmin = () => location.hash === "#admin";
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const cfg = () => S.cfg || DEF;
const waNum = () => String(cfg().whatsapp || WA_DEFAULT).replace(/\D/g, "");
const waLink = t => "https://wa.me/" + waNum() + (t ? "?text=" + encodeURIComponent(t) : "");
const initials = n => { const caps = (String(n).match(/[A-ZÁÉÍÓÚÑ]/g) || []); return (caps.length >= 2 ? caps[0] + caps[1] : String(n).slice(0, 2)).toUpperCase(); };
const parsePrice = s => { const x = parseFloat(String(s).replace(/^\s*s\/\.?\s*/i, "").replace(",", ".").trim()); return isFinite(x) && x > 0 ? Math.round(x * 100) / 100 : null; };

let toastT;
function toast(m, bad) { const t = $("#toast"); t.textContent = m; t.className = "show" + (bad ? " bad" : ""); clearTimeout(toastT); toastT = setTimeout(() => { t.className = ""; }, 2800); }
const dlg = $("#dlg");
function openSheet(html) { dlg.innerHTML = '<div class="sh">' + html + "</div>"; if (!dlg.open) dlg.showModal(); }
function closeSheet() { S.sheet = ""; if (dlg.open) dlg.close(); }
dlg.addEventListener("click", e => { if (e.target === dlg) closeSheet(); });
dlg.addEventListener("close", () => { S.sheet = ""; });

/* ---------- Datos ---------- */
const CK = "lv_cfg_" + TIENDA;
function applyDoc(d) { S.cfg = { ...DEF, ...d }; S.prods = Array.isArray(d.productos) ? d.productos : []; S.exists = true; }
function cacheSave() { lsSet(CK, JSON.stringify({ ...S.cfg, productos: S.prods })); }
async function load() {
  try { const c = JSON.parse(lsGet(CK) || "null"); if (c) { applyDoc(c); S.loaded = true; restoreCart(); render(); } } catch (e) {}
  try {
    const s = await getDoc(ref);
    if (s.exists()) { applyDoc(s.data()); cacheSave(); } else { S.exists = false; S.cfg = null; S.prods = []; }
    S.error = "";
  } catch (e) { if (!S.cfg) S.error = "No pudimos cargar el catálogo. Revisa tu internet e intenta de nuevo."; S.errCode = (e && (e.code || e.message)) || "desconocido"; }
  S.loaded = true; restoreCart(); render();
}
async function commit(list, extra) {
  const prev = S.prods;
  if (JSON.stringify(list).length > 900000) { toast("Ya no caben más productos en esta tienda", true); return false; }
  S.prods = list;
  try { await setDoc(ref, { productos: list, ...(extra || {}), actualizado: Date.now() }, { merge: true }); cacheSave(); return true; }
  catch (e) { S.prods = prev; toast(saveErr(e), true); return false; }
}
async function saveCfg(patch) {
  const prev = S.cfg;
  S.cfg = { ...S.cfg, ...patch };
  try { await setDoc(ref, { ...patch, actualizado: Date.now() }, { merge: true }); cacheSave(); return true; }
  catch (e) { S.cfg = prev; toast(saveErr(e), true); return false; }
}
const saveErr = e => (e && e.code === "permission-denied") ? "No tienes permiso. Entra con la cuenta del dueño." : "No se guardó. Revisa tu internet e intenta otra vez.";

/* ---------- Carrito ---------- */
const CART = "lv_cart_" + TIENDA, FORM = "lv_form_" + TIENDA;
function saveCart() { lsSet(CART, JSON.stringify(S.cart)); }
function restoreCart() {
  try { const c = JSON.parse(lsGet(CART) || "{}"); S.cart = {}; Object.keys(c).forEach(id => { if (S.prods.some(p => p.id === id && !p.a)) S.cart[id] = c[id]; }); } catch (e) { S.cart = {}; }
  try { const f = JSON.parse(lsGet(FORM) || "{}"); if (f.nombre) S.form.nombre = f.nombre; if (f.dir) S.form.dir = f.dir; } catch (e) {}
}
const cartItems = () => S.prods.filter(p => S.cart[p.id] && !p.a).map(p => ({ p, q: S.cart[p.id] }));
const cartTotal = () => cartItems().reduce((t, i) => t + i.p.p * i.q, 0);
const cartCount = () => cartItems().reduce((t, i) => t + i.q, 0);

/* ---------- Tienda pública ---------- */
const vis = p => (S.cat === "Todos" || p.c === S.cat) && (!S.q || norm(p.n + " " + p.u + " " + p.c).includes(norm(S.q)));

function rowHTML(p) {
  const q = S.cart[p.id] || 0;
  const ctl = p.a ? '<span class="out">Agotado</span>'
    : q ? `<div class="st"><button data-act="dec" data-id="${p.id}" aria-label="Quitar uno">−</button><b>${q}</b><button data-act="inc" data-id="${p.id}" aria-label="Agregar uno">+</button></div>`
    : `<button class="add" data-act="inc" data-id="${p.id}">Agregar</button>`;
  return `<article class="it${p.a ? " off" : ""}" id="r-${p.id}"><div class="nm"><b>${esc(p.n)}</b>${p.u ? `<small>${esc(p.u)}</small>` : ""}<span class="pr">${money(p.p)}</span></div>${ctl}</article>`;
}
function groupHTML(list, row) {
  return catsOf(list).map(c => `<section class="sec"><h2>${esc(c)}</h2>${list.filter(p => p.c === c).map(row).join("")}</section>`).join("");
}
function renderList() {
  const el = $("#list"); if (!el) return;
  if (!S.prods.length) { el.innerHTML = `<div class="empty"><b>Estamos preparando el catálogo</b>Mientras tanto, escríbenos por WhatsApp y te pasamos precios.</div>`; return; }
  const l = S.prods.filter(vis);
  el.innerHTML = l.length ? groupHTML(l, rowHTML) : `<div class="empty"><b>No encontramos ese producto</b>Escríbenos por WhatsApp y te ayudamos.</div>`;
}
function renderCats() {
  const el = $("#cats"); if (!el) return;
  const cs = catsOf(S.prods);
  el.innerHTML = cs.length > 1 ? ["Todos", ...cs].map(c => `<button class="cat${S.cat === c ? " on" : ""}" data-act="cat" data-v="${esc(c)}">${esc(c)}</button>`).join("") : "";
}
function renderBar() {
  const el = $("#bar"); if (!el) return;
  const n = cartCount();
  el.innerHTML = n ? `<button data-act="cart"><span>Ver mi pedido · ${n} ${n === 1 ? "producto" : "productos"}</span><span>${money(cartTotal())}</span></button>` : "";
}
function renderShop() {
  const c = cfg();
  document.title = c.nombre;
  if (!S.loaded) { $("#app").innerHTML = '<div class="load">Cargando catálogo…</div>'; return; }
  if (S.error) { $("#app").innerHTML = `<div class="load">${esc(S.error)}<br><br><button class="btn gold" onclick="location.reload()">Reintentar</button><p class="hint" style="margin-top:18px">Detalle técnico: ${esc(S.errCode || "")}</p></div>`; return; }
  const tags = [c.horario, c.pedidoMin > 0 ? "Pedido mínimo " + money(c.pedidoMin) : "", c.delivery].filter(Boolean);
  const datos = [["Horario", c.horario], ["Dirección", c.direccion], ["Delivery", c.delivery], ["Pedido mínimo", c.pedidoMin > 0 ? money(c.pedidoMin) : ""]].filter(r => r[1]);
  $("#app").innerHTML = `
  <header class="hero"><div class="wrap">
    <span class="mono">${esc(initials(c.nombre))}</span>
    <h1>${esc(c.nombre)}</h1>
    <p class="lema">${esc(c.lema)}</p>
    ${tags.length ? `<div class="tags">${tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
    <div class="cta">
      <button class="btn gold" data-act="goto">Ver catálogo y pedir</button>
      <a class="btn ghost" href="${waLink("Hola, quisiera información de sus productos.")}" target="_blank" rel="noopener">Escribirnos por WhatsApp</a>
    </div>
  </div></header>
  <div class="sticky" id="catalogo"><div class="wrap">
    <input class="search" id="q" type="search" placeholder="Buscar producto…" value="${esc(S.q)}" autocomplete="off">
    <div class="cats" id="cats"></div>
  </div></div>
  <main class="wrap" id="list"></main>
  <footer class="wrap foot">
    ${datos.length ? `<h2>Datos</h2><dl class="dl">${datos.map(r => `<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join("")}</dl>` : ""}

async function saveProd(more) {

function parseLine(raw) {
  let l = raw.replace(/^[\s•*·\-–—]+/, "").trim();
  if (!l) return null;
  let n, u = "", p, c = "";
  if (/[|;\t]/.test(l)) {
    const a = l.split(/\s*[|;\t]\s*/).map(x => x.trim());
    if (a.length === 2) { n = a[0]; p = parsePrice(a[1]); }
    else if (a.length === 3) { if (parsePrice(a[2]) != null) { n = a[0]; u = a[1]; p = parsePrice(a[2]); } else { n = a[0]; p = parsePrice(a[1]); c = a[2]; } }
    else if (a.length >= 4) { n = a[0]; u = a[1]; p = parsePrice(a[2]); c = a[3]; }
  } else {
    const m = l.match(/^(.+?)[\s:–—-]*(?:s\/\.?\s*)?(\d+(?:[.,]\d{1,2})?)\s*$/i);
    if (m) { n = m[1].trim(); p = parsePrice(m[2]); }
  }
  if (!n || p == null) return { bad: raw };
  return { n, u, p, c };
}

async function bulkGo() {
  const t = $("#bt").value, defC = $("#bc").value.trim() || "Otros";
  const lines = t.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  if (!lines.length) { toast("Pega o escribe tu lista", true); return; }
  const list = S.prods.map(x => ({ ...x })), bad = []; let nuevos = 0, act = 0;
  lines.forEach(raw => {
    const r = parseLine(raw);
    if (!r) return;
    if (r.bad) { bad.push(r.bad); return; }
    const k = norm(r.n) + "|" + norm(r.u), ex = list.find(x => norm(x.n) + "|" + norm(x.u) === k);
    if (ex) { ex.p = r.p; if (r.c) ex.c = r.c; act++; } else { list.push({ id: uid(), n: r.n, u: r.u, p: r.p, c: r.c || defC, a: false }); nuevos++; }
  });
  if (!nuevos && !act) { toast("No se entendió ninguna línea. Revisa el formato.", true); return; }
  toast("Guardando…");
  if (await commit(list)) {
    S.last.c = defC; renderAList();
    if (bad.length) { $("#bt").value = bad.join("\n"); toast(`${nuevos} nuevos, ${act} actualizados. ${bad.length} líneas no se entendieron (quedaron en la caja).`, true); }
    else { closeSheet(); toast(`Listo: ${nuevos} nuevos, ${act} actualizados ✓`); }
  }
}
function pctNew(p, pct, round) { let x = p * (1 + pct / 100); x = round ? Math.round(x * 10) / 10 : Math.round(x * 100) / 100; return Math.max(x, 0.1); }
function pctSheet() {
  S.sheet = "pct";
  openSheet(`<h3>Subir o bajar precios</h3>
    <p class="hint">Cambia muchos precios de una vez. Número positivo para subir (ej. 5) o negativo para bajar (ej. -3).</p>

function pctPreview() {

async function pctGo() {
  const pct = parseFloat(($("#pp").value || "").replace(",", ".")), sc = $("#ps").value, r = $("#pr").checked;
  if (!isFinite(pct) || pct === 0) { toast("Escribe el porcentaje (ej. 5)", true); return; }

}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  switch (a) {
    case "inc": setQty(id, (S.cart[id] || 0) + 1); break;
    case "dec": setQty(id, (S.cart[id] || 0) - 1); break;
    case "cat": S.cat = v; renderCats(); renderList(); break;
    case "goto": $("#catalogo").scrollIntoView({ behavior: "smooth" }); break;
    case "cart": openCart(); break;
    case "tipo": S.form.tipo = v; openCart(); break;
    case "send": sendOrder(); break;
    case "close": closeSheet(); break;
    case "mode": S.email = ($("#em") || {}).value || S.email; S.mode = v; renderAdmin(); break;
    case "forgot": {
      const em = ($("#em").value || "").trim();
      if (!em) { setMsg("Escribe tu correo arriba y vuelve a tocar “Olvidé mi clave”."); break; }
      try { await sendPasswordResetEmail(auth, em); setMsg("Te enviamos un correo para cambiar tu clave. Revisa también spam.", true); } catch (err) { setMsg(authMsg(err)); }
      break;
    }
    case "logout": await signOut(auth); break;
    case "activar":
      try { await setDoc(ref, { ...DEF, ownerUid: S.user.uid, productos: [], actualizado: Date.now() }); applyDoc({ ...DEF, ownerUid: S.user.uid, productos: [] }); cacheSave(); toast("Tienda activada ✓"); renderAdmin(); }
      catch (err) { toast(saveErr(err), true); }
      break;
    case "tab": S.tab = v; renderAdmin(); break;
    case "new": prodSheet(); break;
    case "edit": prodSheet(id); break;
    case "tgl": {
      const p = S.prods.find(x => x.id === id); if (!p) break;
      if (await commit(S.prods.map(x => x.id === id ? { ...x, a: !x.a } : x))) { renderAList(); toast(p.a ? "Marcado como agotado" : "Marcado como disponible"); }
      break;
    }
    case "saveMore": saveProd(true); break;
    case "del":
      if (confirm("¿Eliminar este producto?") && await commit(S.prods.filter(x => x.id !== id))) { closeSheet(); renderAList(); toast("Eliminado"); }
      break;
    case "bulk": bulkSheet(); break;
    case "ejemplo": $("#bt").value = EJEMPLO; break;
    case "bulkgo": bulkGo(); break;
    case "pct": if (!S.prods.length) toast("Primero agrega productos", true); else pctSheet(); break;
    case "pctgo": pctGo(); break;
    case "copy": {
      const url = location.origin + location.pathname;
      try { await navigator.clipboard.writeText(url); toast("Link copiado ✓"); } catch (err) { prompt("Copia este link:", url); }
      break;
    }
    case "chpw":
      try { await sendPasswordResetEmail(auth, S.user.email); toast("Te enviamos un correo para cambiar tu clave"); } catch (err) { toast(authMsg(err), true); }
      break;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { S.q = t.value; renderList(); }
  else if (t.id === "aq") { S.aq = t.value; renderAList(); }
  else if (t.dataset && t.dataset.f) S.form[t.dataset.f] = t.value;
  else if (t.id === "pp" || t.id === "ps" || t.id === "pr") pctPreview();
});
document.addEventListener("change", e => { if (e.target.id === "ps" || e.target.id === "pr") pctPreview(); });
document.addEventListener("submit", async e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "fl") {
    const em = $("#em").value.trim(), pw = $("#pw").value;
    if (!em || !pw) { setMsg("Escribe tu correo y tu clave."); return; }
    S.email = em; setMsg("Entrando…", true);
    try { if (S.mode === "new") await createUserWithEmailAndPassword(auth, em, pw); else await signInWithEmailAndPassword(auth, em, pw); }
    catch (err) { setMsg(authMsg(err)); }
  } else if (id === "fp") saveProd(false);
  else if (id === "fn") {
    const E = e.target.elements;
    let wa = E.whatsapp.value.replace(/\D/g, ""); if (wa.length === 9) wa = "51" + wa;
    if (wa.length < 11) { toast("El WhatsApp no parece completo. Ej. 51987654321", true); return; }
    if (!E.nombre.value.trim()) { toast("Falta el nombre del negocio", true); return; }
    const min = parseFloat(String(E.pedidoMin.value).replace(",", ".")) || 0;
    if (await saveCfg({ nombre: E.nombre.value.trim(), lema: E.lema.value.trim(), whatsapp: wa, horario: E.horario.value.trim(), direccion: E.direccion.value.trim(), delivery: E.delivery.value.trim(), pedidoMin: Math.max(0, min) })) { toast("Guardado ✓"); renderAdmin(); }
  }
});

render();
load();
</script>
</body>
</html>
